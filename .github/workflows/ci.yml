name: CI

on:
  push:
    branches:
      - master
      - main
      - 'feature/**'
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend Pytest & Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.14"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies from lockfile
        run: uv pip install -r requirements.lock

      - name: Run Backend Pytest Suite
        run: uv run pytest -v

  mobile-tests:
    name: Mobile Typecheck, Tests & Export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm --dir apps/mobile install --frozen-lockfile

      - name: Typecheck
        run: pnpm --dir apps/mobile typecheck

      - name: ESLint
        run: pnpm --dir apps/mobile lint

      - name: Run Vitest Suite
        run: pnpm --dir apps/mobile test

      - name: Run Jest Component Suite
        run: pnpm --dir apps/mobile test:component

      - name: Export Android Bundle
        run: pnpm --dir apps/mobile export --platform android

  docker-build-and-smoke:
    name: Container Build & Rehearsal Smoke Test
    runs-on: ubuntu-latest
    needs: [backend-tests]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: api
          load: true
          tags: thali-api:${{ github.sha }},thali-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: worker
          load: true
          tags: thali-worker:${{ github.sha }},thali-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Migration Image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrate
          load: true
          tags: thali-migrate:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Container Smoke Test Suite
        run: ./scripts/smoke_test_containers.sh
